<style>
html.lenis, html.lenis body { height: auto; }
.lenis.lenis-smooth { scroll-behavior: auto !important; }
.lenis.lenis-stopped { overflow: hidden; }

/* Maps lockp */
.lenis-map-overlay { display: none; }

@media (min-width: 921px) {
	.lenis-map-wrap { position: relative !important; isolation: isolate; }
	.lenis-map-wrap iframe { position: relative; z-index: 0; pointer-events: none !important; }
	.lenis-map-overlay {
		display: flex;
		position: absolute;
		inset: 0;
		z-index: 10;
		align-items: flex-end;
		justify-content: center;
		padding-bottom: 16px;
		cursor: pointer;
	}
	.lenis-map-overlay span {
		background: rgba(0, 0, 0, 0.7);
		color: #fff;
		font-size: 12px;
		line-height: 1;
		padding: 8px 14px;
		border-radius: 100px;
		opacity: 0;
		transform: translateY(6px);
		transition: opacity 0.25s ease, transform 0.25s ease;
		pointer-events: none;
	}
	.lenis-map-overlay:hover span { opacity: 1; transform: translateY(0); }
	.lenis-map-wrap.is-active .lenis-map-overlay { display: none; }
	.lenis-map-wrap.is-active iframe { pointer-events: auto !important; }
}
</style>

<script>
(function () {
	var MAP_SEL = 'iframe[src*="maps.google"],iframe[src*="google.com/maps"],iframe[data-src*="maps.google"],iframe[data-src*="google.com/maps"]';

	function isPreview() {
		var b = document.body.classList;
		return window.self !== window.top ||
			/[?&](elementor-preview|customize_changeset_uuid|customize_messenger_channel|preview|preview_id)=/.test(location.search) ||
			b.contains('elementor-editor-active') ||
			b.contains('elementor-editor-preview') ||
			!!(window.wp && wp.customize);
	}

	function lockMaps() {
		document.querySelectorAll(MAP_SEL).forEach(function (iframe) {
			var wrap = iframe.parentElement;
			if (!wrap || wrap.classList.contains('lenis-map-wrap')) return;

			wrap.classList.add('lenis-map-wrap');
			var overlay = document.createElement('div');
			overlay.className = 'lenis-map-overlay';
			overlay.innerHTML = '<span>Klik untuk menggeser peta</span>';
			overlay.addEventListener('click', function () { wrap.classList.add('is-active'); });
			wrap.addEventListener('mouseleave', function () { wrap.classList.remove('is-active'); });
			wrap.appendChild(overlay);
		});
	}

	function initLenis() {
		if (window.__lenis) return;
		document.documentElement.style.scrollBehavior = 'auto';

		var lenis = window.__lenis = new Lenis({
			duration: 1.2,
			easing: function (t) { return Math.min(1, 1.001 - Math.pow(2, -10 * t)); },
			smoothWheel: true,
			touchMultiplier: 1.5
		});

		(function raf(t) { lenis.raf(t); requestAnimationFrame(raf); })();

		// anchor link smooth scroll
		document.addEventListener('click', function (e) {
			var a = e.target.closest('a[href*="#"]');
			if (!a || a.hash.length < 2 || a.pathname !== location.pathname || a.hostname !== location.hostname) return;
			var target;
			try { target = document.querySelector(a.hash); } catch (err) { return; }
			if (!target) return;
			e.preventDefault();
			lenis.scrollTo(target, { offset: -90 });
		});

		lockMaps();
		window.addEventListener('load', lockMaps);
		var t;
		new MutationObserver(function () {
			clearTimeout(t);
			t = setTimeout(lockMaps, 200);
		}).observe(document.body, { childList: true, subtree: true });
	}

	function boot() {
		if (isPreview()) return;
		if (window.Lenis) return initLenis();
		if (document.getElementById('lenis-lib')) return;
		var s = document.createElement('script');
		s.id = 'lenis-lib';
		s.src = 'https://cdn.jsdelivr.net/npm/lenis@1.1.17/dist/lenis.min.js';
		s.onload = initLenis;
		document.head.appendChild(s);
	}

	document.readyState === 'loading'
		? document.addEventListener('DOMContentLoaded', boot)
		: boot();
})();
</script>
